<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Scribe — code &amp; text editor</title>
<meta name="description" content="A fast, multi-tab, syntax-highlighting notepad for the browser." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2315171b'/%3E%3Cpath d='M9 6h11l5 5v15a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='%23242830' stroke='%23e3a63e' stroke-width='1.4'/%3E%3Cpath d='M20 6v5h5' fill='none' stroke='%23e3a63e' stroke-width='1.4'/%3E%3Cpath d='M11.5 19.5l2.4-2.4M11.5 19.5l3.4.6-.6-3.4 6.2-6.2 3 3-6.2 6.2z' fill='none' stroke='%23e3a63e' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

<!-- CodeMirror core -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ===== Toolbar ===== -->
  <header class="toolbar">
    <div class="brand">
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 32 32" fill="none">
        <path d="M9 6h11l5 5v15a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z" fill="var(--bg-elevated)" stroke="var(--accent)" stroke-width="1.5"/>
        <path d="M20 6v5h5" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
        <path d="M11.5 19.5l2.4-2.4M11.5 19.5l3.4.6-.6-3.4 6.2-6.2 3 3-6.2 6.2z" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="brand-name">Scribe</span>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button class="tbtn" id="btn-new" title="New tab (Ctrl+N)">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span>New</span>
      </button>
      <button class="tbtn" id="btn-open" title="Open file (Ctrl+O)">
        <svg viewBox="0 0 20 20"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H8l1.5 2H16a1 1 0 0 1 1 1v6.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5v-8z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
        <span>Open</span>
      </button>
      <button class="tbtn" id="btn-save" title="Save (Ctrl+S)">
        <svg viewBox="0 0 20 20"><path d="M4 3h9l4 4v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M6.5 3v4h6V3M6.5 17v-5h7v5" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
        <span>Save</span>
      </button>
      <button class="tbtn" id="btn-saveas" title="Save As (Ctrl+Shift+S)">
        <svg viewBox="0 0 20 20"><path d="M4 3h9l4 4v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/><path d="M6.5 3v4h4" stroke="currentColor" stroke-width="1.5" fill="none"/><circle cx="13.5" cy="13.5" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M13.5 12.2v2.6M12.2 13.5h2.6" stroke="currentColor" stroke-width="1.2"/></svg>
        <span class="hide-narrow">Save As</span>
      </button>
    </div>

    <div class="toolbar-divider"></div>

    <div class="toolbar-group">
      <button class="tbtn icon-only" id="btn-undo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 20 20"><path d="M6 8H4V6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.2 8.2A6 6 0 1 1 5 13" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="tbtn icon-only" id="btn-redo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 20 20"><path d="M14 8h2V6" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.8 8.2A6 6 0 1 0 15 13" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button class="tbtn icon-only" id="btn-find" title="Find &amp; Replace (Ctrl+F)">
        <svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="4.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15 15l-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="toolbar-spacer"></div>

    <div class="toolbar-group">
      <button class="tbtn icon-only" id="btn-theme" title="Toggle light/dark theme">
        <svg id="theme-icon" viewBox="0 0 20 20"></svg>
      </button>
    </div>
  </header>

  <!-- ===== Tab strip ===== -->
  <div class="tabstrip-wrap">
    <div class="tabstrip" id="tabstrip"></div>
    <button class="tab-add" id="btn-tab-add" title="New tab">
      <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- ===== Editor ===== -->
  <main class="editor-wrap" id="editor-wrap">
    <div id="editor-host"></div>

    <!-- Find & replace floating panel -->
    <div class="findbar" id="findbar" hidden>
      <div class="findbar-row">
        <svg class="findbar-icon" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="4.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15 15l-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" id="find-input" placeholder="Find" autocomplete="off" spellcheck="false" />
        <span class="find-count" id="find-count">0/0</span>
        <button class="fbtn" id="find-prev" title="Previous (Shift+Enter)">
          <svg viewBox="0 0 20 20"><path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 10 10)"/></svg>
        </button>
        <button class="fbtn" id="find-next" title="Next (Enter)">
          <svg viewBox="0 0 20 20"><path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="fbtn toggle" id="find-case" title="Match case">Aa</button>
        <button class="fbtn toggle" id="find-word" title="Whole word">"ab"</button>
        <button class="fbtn toggle" id="find-regex" title="Use regular expression">.*</button>
        <button class="fbtn" id="find-close" title="Close (Esc)">
          <svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="findbar-row">
        <svg class="findbar-icon" viewBox="0 0 20 20"><path d="M4 10h8m0 0l-3-3m3 3l-3 3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 5v5a2 2 0 0 1-2 2H9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <input type="text" id="replace-input" placeholder="Replace" autocomplete="off" spellcheck="false" />
        <button class="fbtn text" id="replace-one">Replace</button>
        <button class="fbtn text" id="replace-all">Replace All</button>
      </div>
    </div>

    <!-- Drag & drop overlay -->
    <div class="dropzone" id="dropzone" hidden>
      <div>Drop file to open in a new tab</div>
    </div>
  </main>

  <!-- ===== Status bar ===== -->
  <footer class="statusbar">
    <div class="status-left">
      <span id="stat-position">Ln 1, Col 1</span>
      <span class="status-sep">|</span>
      <span id="stat-selection"></span>
    </div>
    <div class="status-right">
      <span id="stat-length">0 chars</span>
      <span class="status-sep">|</span>
      <button class="statbtn" id="stat-wrap" title="Toggle word wrap">Wrap: Off</button>
      <span class="status-sep">|</span>
      <button class="statbtn" id="stat-eol" title="Toggle line-ending style">LF</button>
      <span class="status-sep">|</span>
      <span id="stat-encoding">UTF-8</span>
      <span class="status-sep">|</span>
      <button class="statbtn lang-select" id="stat-lang" title="Change language mode">Plain Text</button>
    </div>
  </footer>

</div>

<!-- Language picker popover -->
<div class="lang-popover" id="lang-popover" hidden></div>

<!-- Generic confirm modal -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <p class="modal-message" id="modal-message"></p>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<input type="file" id="file-input" multiple hidden />

<!-- ===== CodeMirror core + modes + addons (CDN) ===== -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/markdown-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/comment-fold.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/php/php.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/rust/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/ruby/ruby.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/perl/perl.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/powershell/powershell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/dockerfile/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/toml/toml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/swift/swift.min.js"></script>

<script src="app.js"></script>
</body>
</html>
